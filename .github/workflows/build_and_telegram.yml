name: Build Private APK Only

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Save Debug APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NewBlackbox-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Save Release APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NewBlackbox-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          
